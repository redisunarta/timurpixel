<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timur Pixel</title>
<meta name="description" content="Timur Pixel — small apps made in Indonesia by Redi Sunarta.">
<style>
  :root {
    --night: #231D3A; --raised: #2F2750; --line: #4A3F75;
    --text: #F3EEFF; --muted: #B9AEE0; --peach: #FFD9B8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--night); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 15px; }
  a { color: var(--peach); }
  .app { display: block; background: var(--raised); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 20px; margin: 28px 0 10px; text-decoration: none; color: var(--text); }
  .app strong { font-size: 20px; }
  .app span { display: block; color: var(--muted); font-size: 15px; }
  .links { font-size: 15px; }
  footer { border-top: 1px solid var(--line); margin-top: 40px; padding-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Timur Pixel</h1>
  <p class="muted">Small apps made in Indonesia by Redi Sunarta.</p>

  <a class="app" href="melekwoy/">
    <strong>Melek Woy!</strong>
    <span>Alarm yang cuma mati kalau kamu bangun. · The alarm that only stops once you're up.</span>
  </a>
  <p class="links"><a href="melekwoy/">Support</a> · <a href="melekwoy/privacy.html">Privacy policy</a></p>

  <footer class="muted">Contact: <a href="mailto:redi.sunarta@gmail.com">redi.sunarta@gmail.com</a></footer>
</main>
</body>
</html>
